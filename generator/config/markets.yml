# Market definitions for the Areta store network.
# store_weight drives how many stores build_dim_store.py generates per market — must sum to 1.0.
# channel_mix is the split between owned retail and third-party concession stores.
# price_index is a multiplier applied to base GBP prices before FX, to reflect local pricing.

home_market: UK

markets:
  - code: UK
    name: United Kingdom
    currency: GBP
    is_home_market: true
    store_weight: 0.42
    channel_mix: { retail: 0.55, concession: 0.45 }
    price_index: 1.00

  - code: DE
    name: Germany
    currency: EUR
    is_home_market: false
    store_weight: 0.16
    channel_mix: { retail: 0.70, concession: 0.30 }
